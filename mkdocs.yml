# ------------------------------
# Content / Context
# ------------------------------
site_name: XLSForm.org
site_description: >
  This site will help you author XLSForms.
  XLSForm is a tool used to simplify the creation of forms.
  XLSForm will convert forms authored in Excel into XForms
  that can be used with a number of web or mobile platforms.

extra:
  email: info@xlsform.org
  github_url: https://github.com/XLSForm/xlsform.github.io
  github_username: XLSForm
  g_analytics_token: 'UA-55713660-1'
  g_analytics_domain: 'xlsform.org'

nav:
  - Home: index.md
  - Reference: reference.md


# ------------------------------
# Appearance / Rendering
# ------------------------------
theme:
  name: null
  custom_dir: docs/theme
  locale: en

extra_css:
  - main.css

extra_javascript:
  - main.js

# Empty list to disable default "search" plugin.
plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: false
